site_name: amulett
site_description: Rust-Firmware und Hardware-Doku für das Waveshare ESP32-S3-Touch-AMOLED-1.75
site_url: https://rincewindwizzard.github.io/amulett/
repo_url: https://github.com/RincewindWizzard/amulett
docs_dir: docs
strict: true

theme:
  name: readthedocs
  locale: de
  highlightjs: true
  hljs_languages:
    - rust
    - toml
  navigation_depth: 3

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Start: index.md
  - Hardware:
      - Übersicht: hardware.md
      - Energie (AXP2101): energie.md
      - Display (CO5300): display.md
      - Touch und Tasten: eingabe.md
      - Bewegungssensor (QMI8658): imu.md
      - Audio (ES8311, ES7210): audio.md
      - Funk (WLAN, BLE): funk.md
      - Weitere Bausteine: weitere-bausteine.md
  - Stromverbrauch: stromverbrauch.md
